services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

  backend:
    image: voxelads-backend:latest
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backend-worker:
    image: voxelads-backend:latest
    build:
      context: ./backend
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=60
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backend-scheduler:
    image: voxelads-backend:latest
    build:
      context: ./backend
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16.15-alpine3.24
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: voxelads
      POSTGRES_USER: voxelads
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxelads -d voxelads"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  frontend_node_modules:
  frontend_next:
  backend_vendor:
  postgres_data:
  redis_data:
